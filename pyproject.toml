[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchapi-mcp"
version = "0.1.0"
description = "MCP server exposing SearchApi.io real-time SERP data as tools for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rustem Mukhametzhan" }
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0"
]

[project.scripts]
searchapi-mcp = "server:main"
